name: Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: production-smoke
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Run production smoke checks
        id: smoke
        shell: bash
        continue-on-error: true
        run: |
          set +e
          npm run smoke:production 2>&1 | tee production-smoke.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Ensure smoke alert label exists
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh label list --search production-smoke --json name --jq '.[].name' | grep -Fxq production-smoke; then
            gh label create production-smoke \
              --color D73A4A \
              --description "Automated production smoke alert"
          fi

      - name: Open or update failure issue
        if: steps.smoke.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          title="Production Smoke failed"
          body_file="production-smoke-issue.md"
          {
            echo "Production Smoke failed on \`${GITHUB_REF_NAME}\`."
            echo
            echo "Run: ${RUN_URL}"
            echo
            echo '```text'
            tail -n 120 production-smoke.log
            echo '```'
          } > "${body_file}"

          existing_issue=$(gh issue list \
            --state open \
            --label production-smoke \
            --search "${title} in:title" \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "${existing_issue}" ]; then
            gh issue comment "${existing_issue}" --body-file "${body_file}"
          else
            gh issue create \
              --title "${title}" \
              --label production-smoke \
              --body-file "${body_file}"
          fi

      - name: Close resolved failure issues
        if: steps.smoke.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue list \
            --state open \
            --label production-smoke \
            --search "Production Smoke failed in:title" \
            --json number \
            --jq '.[].number' | while read -r issue; do
              [ -z "${issue}" ] && continue
              gh issue comment "${issue}" --body "Production Smoke is passing again in run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Closing this alert."
              gh issue close "${issue}" --reason completed
            done

      - name: Fail workflow on smoke failure
        if: steps.smoke.outputs.status != '0'
        run: exit 1
